name: Update news snapshot

on:
  schedule:
    # Every six hours, offset from the top of the hour.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest stories
        run: python3 scripts/fetch_news.py

      - name: Commit snapshot
        run: |
          if git diff --quiet -- data/news.json; then
            echo "No news changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          git commit -m "Update news snapshot"
          git push
